<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg_shoes" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffcf7"/>
      <stop offset="60%" stop-color="#f7edde"/>
      <stop offset="100%" stop-color="#e0cbb2"/>
    </radialGradient>
    <filter id="shadow_shoes" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4a2c11" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- 主徽章底盘 -->
  <circle cx="100" cy="100" r="92" fill="url(#bg_shoes)" stroke="#a06535" stroke-width="4.5" filter="url(#shadow_shoes)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#a06535" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.45"/>
  
  <!-- 核心拟物文化图标 -->
  <text x="100" y="100" font-size="90" text-anchor="middle" dominant-baseline="central">👞</text>
</svg>
